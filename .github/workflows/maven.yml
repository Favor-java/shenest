name: Spring Boot build and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JUnit tests and install executable JAR
        working-directory: server
        run: ./mvnw -B clean install
      - name: Verify packaged application workflows and persistence
        run: node server/scripts/smoke-check.mjs
      - name: Upload executable JAR and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenest-jar-and-test-reports
          path: |
            server/target/shenest-server-1.0.0.jar
            server/target/surefire-reports/
