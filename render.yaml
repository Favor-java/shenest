services:
  - type: web
    name: shenest
    runtime: docker
    plan: free           # free plan: no persistent disk, data resets on redeploy/restart
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/shenest.db
      - key: UPLOAD_DIR
        value: /data/uploads
