server.port=${PORT:4000}
# Reads the same .env file as the former Express server when run from server/.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:data/shenest.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
shenest.jwt-secret=${JWT_SECRET:development-secret-change-me}
shenest.upload-dir=${UPLOAD_DIR:uploads}
shenest.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=SHENEST_SESSION
server.servlet.session.cookie.same-site=lax
