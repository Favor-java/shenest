<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <article
      class="property-card"
      th:fragment="card(property)"
      th:with="saved=${property.saved}"
    >
      <div class="property-image-wrap">
        <img
          th:src="${property.image ?: '/images/hero-home.png'}"
          th:alt="${property.title}"
          class="property-image"
        />
        <form class="inline-form" action="/ui/forms/favorite" method="post">
          <input type="hidden" name="_csrf" th:value="${csrf}" />
          <input type="hidden" name="propertyId" th:value="${property.id}" />
          <input type="hidden" name="returnTo" th:value="${currentPath}" />
        <button
          th:class="${saved ? 'heart-button saved' : 'heart-button'}"
          type="submit"
          th:attr="aria-pressed=${saved},aria-label=${saved ? 'Remove ' + property.title + ' from favorites' : 'Save ' + property.title}"
        >
          <svg th:replace="~{fragments/icons :: heart(19, ${saved})}"></svg>
        </button>
        </form>
      </div>
      <div class="property-content">
        <div class="property-title-row">
          <h3 th:text="${property.title}"></h3>
          <th:block th:if="${property.verified != 0}">
            <svg th:replace="~{fragments/icons :: shield-check(18)}"></svg>
          </th:block>
          <th:block th:if="${property.verified == 0}">0</th:block>
        </div>
        <p class="location">
          <svg th:replace="~{fragments/icons :: map-pin(15)}"></svg>
          <th:block th:text="${property.location}"></th:block>
        </p>
        <p class="property-type" th:text="${property.type}"></p>
        <div class="property-footer">
          <strong
            >₦<th:block
              th:text="${#numbers.formatInteger(property.price,1,'COMMA')}"
            ></th:block
            ><span>/yr</span></strong
          ><a
            class="property-card-link"
            th:href="@{/properties/{id}(id=${property.id})}"
            th:attr="aria-label=${'View ' + property.title}"
            >View home</a
          >
        </div>
      </div>
    </article>
  </body>
</html>
